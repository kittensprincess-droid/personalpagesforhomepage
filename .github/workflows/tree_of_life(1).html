svg{width:100%;height:100%}
.e path{fill:none;stroke:var(--line);stroke-width:1.5}

.n.leaf rect{fill:var(--leaf)}
.fold circle{fill:var(--s);stroke:var(--bd);cursor:pointer}
.fold text{fill:var(--fg);font-size:13px;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
.n.hit rect{stroke:#e11d48;stroke-width:3}.n.dim{opacity:.25}

const s=document.getElementById('s'),eg=document.getElementById('eg');let vb=[0,0,1000,600];
const set=()=>s.setAttribute('viewBox',vb.join(' '));
const geo=()=>{const r=s.getBoundingClientRect(),k=Math.min(r.width/vb[2],r.height/vb[3]);
return{r,k,ox:(r.width-vb[2]*k)/2,oy:(r.height-vb[3]*k)/2}};

const W=100,H=40,PX=120,PY=80;

const all=Object.values(NS);

const roots=all.filter(n=>!n.p).sort((a,b)=>a.o-b.o);

const EL=EDGES.map(([a,b])=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path'),x=NS[b].p!==a;

function pd(a,b,cross){const x1=a.x+W/2,y1=a.y+H,m=y1+(cross?12:20),r=8;
if(b.st){const cy=b.y+H/2;
return cross?`M${x1},${y1}L${x1},${m}L${b.x-10},${m}L${b.x-10},${cy}L${b.x},${cy}`
:`M${x1},${y1}L${x1},${m}L${b.sp},${m}L${b.sp},${cy}L${b.x},${cy}`}
const x2=b.x+W/2,y2=b.y;
if(x1===x2)return`M${x1},${y1}L${x2},${y2}`;
if(Math.abs(x2-x1)<2*r)return`M${x1},${y1}L${x1},${m}L${x2},${m}L${x2},${y2}`;
const dx=x2>x1?1:-1;
return`M${x1},${y1}L${x1},${m-r}Q${x1},${m} ${x1+dx*r},${m}L${x2-dx*r},${m}Q${x2},${m} ${x2},${m+r}L${x2},${y2}`}

const GAP=12,GX=20;
const bn=y=>Math.floor(y/10);
const ext=(S,q,lo,hi)=>{const e=S.get(q);if(e){if(lo<e[0])e[0]=lo;if(hi>e[1])e[1]=hi}else S.set(q,[lo,hi])};

/* Contour packing: each subtree reports how far left/right it reaches in every 10px band,

function pack(blocks){const acc=new Map();

b.o=o;for(const[q,[lo,hi]]of b.S)ext(acc,q,lo+o,hi+o)}

function build(n,d){n.vis=true;n.y=d*PY;n.blocks=null;
const S=new Map();addBox(S,0,W,n.y);

const last=b.list[b.list.length-1];for(let q=bn(kd*PY-26);q<=bn(last.y+H+6);q++)ext(b.S,q,10,30+W)}
else b.S=build(b.k,kd)}

for(const b of blocks){b.rel=b.o-p;const c=b.rel+(b.list?14:W/2);lo=Math.min(lo,c);hi=Math.max(hi,c)}
for(const[q,[l,h]]of acc)ext(S,q,l-p,h-p);
for(let q=bn(n.y+H+16);q<=bn(kd*PY-12);q++)ext(S,q,lo-2,hi+2);
n.blocks=blocks;return S}
function fin(n,x){n.x=x;if(!n.blocks)return;
for(const b of n.blocks){const bx=x+b.rel;
if(b.list)b.list.forEach(c=>{c.x=bx+30;c.sp=bx+14});else fin(b.k,bx)}}

function layout(){all.forEach(n=>{n.vis=false;n.st=false});
const rb=roots.map(r=>({k:r,S:build(r,0)}));pack(rb);rb.forEach(b=>fin(b.k,b.o));

for(const e of EL){const ok=e.a.vis&&e.b.vis&&!col.has(e.a.id)&&(!e.x||e.b.y>e.a.y+H);e.p.style.display=ok?'':'none';
if(ok)e.p.setAttribute('d',pd(e.a,e.b,e.x))}}

function fit(){let a=1e9,b=1e9,c=-1e9,d=-1e9;
for(const n of all){if(!n.vis)continue;a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x+W);d=Math.max(d,n.y+H)}
const w=Math.max(c-a+80,900),h=Math.max(d-b+80,500);
vb=[(a+c)/2-w/2,(b+d)/2-h/2,w,h];set()}

document.querySelectorAll('.fold').forEach(f=>f.addEventListener('click',()=>{
const n=NS[f.parentNode.dataset.id],ox=n.x,oy=n.y;
if(col.has(n.id)){col.delete(n.id);let c=n;while(c.kids.length===1){c=c.kids[0];col.delete(c.id)}}else col.add(n.id);layout();vb[0]+=n.x-ox;vb[1]+=n.y-oy;set()}));
document.getElementById('fit').onclick=fit;
document.getElementById('hu').onclick=()=>{
const h=all.find(n=>n.g.textContent.trim().toLowerCase()==='human');if(!h)return;
all.forEach(n=>{if(n.fold)col.add(n.id);n.g.classList.remove('hit')});

vb=[h.x+W/2-w/2,h.y+H/2-hh/2,w,hh];set()};
document.getElementById('ca').onclick=()=>{all.forEach(n=>{if(n.fold)col.add(n.id)});layout();fit()};
document.getElementById('ea').onclick=()=>{col.clear();layout();fit()};
document.getElementById('q').oninput=e=>{const t=e.target.value.trim().toLowerCase();

n.g.classList.toggle('hit',!!m);n.g.classList.toggle('dim',!!t&&!m)})};
